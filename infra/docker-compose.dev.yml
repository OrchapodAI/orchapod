# Local development environment — Nebius x NVIDIA Hackathon edition
# Runs Postgres, Redis, and MinIO locally. GPU nodes run on Nebius AI Cloud.
# cpu and api nodes run via LocalDockerProvider.
#
# Usage: make up (postgres, redis, minio in the compose project orchapod-hack)
#
# Keys for the demo (.env; every variable and where to get it: .env.example):
#   NEBIUS_API_KEY       — Token Factory (Nemotron inference, teacher, judge, fine-tuning)
#   TAVILY_API_KEY       — web-research
#   NEBIUS_PROJECT_ID    — AI Cloud Serverless Jobs and Endpoints (gpu nodes)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchapod
      POSTGRES_USER: orchapod
      POSTGRES_PASSWORD: orchapod_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchapod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO as local R2 stand-in (S3-compatible)
  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372  # MinIO RELEASE.2026-08-04 from Pigsty's community builds: minio/minio is no longer pullable anonymously (qa-w10)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orchapod
      MINIO_ROOT_PASSWORD: orchapod_dev
    ports:
      - "9000:9000"   # S3 API (set ORCHAPOD_R2_ENDPOINT=http://localhost:9000)
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # FastAPI control plane
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "8001:8000"   # host 8000 belongs to another project
    environment:
      # docs/contracts.md "Config", with its defaults; storage, database and redis are the services above
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NEBIUS_PROJECT_ID: ${NEBIUS_PROJECT_ID:-}
      NEBIUS_IAM_TOKEN: ${NEBIUS_IAM_TOKEN:-}
      ORCHAPOD_ENDPOINT_TOKEN: ${ORCHAPOD_ENDPOINT_TOKEN:-}
      ORCHAPOD_R2_ENDPOINT: http://minio:9000
      ORCHAPOD_R2_REGION: auto
      ORCHAPOD_R2_ACCESS_KEY: orchapod
      ORCHAPOD_R2_SECRET_KEY: orchapod_dev
      ORCHAPOD_R2_BUCKET: orchapod-artifacts
      ORCHAPOD_IMAGE_PREFIX: ${ORCHAPOD_IMAGE_PREFIX:-ghcr.io/bangadpurva}
      DATABASE_URL: postgresql+asyncpg://orchapod:orchapod_dev@postgres:5432/orchapod
      REDIS_URL: redis://redis:6379
      ORCHAPOD_CONTROL_URL: http://api:8000
      ORCHAPOD_INTERNAL_SECRET: ${ORCHAPOD_INTERNAL_SECRET:-}
      ORCHAPOD_MAX_RUN_USD: ${ORCHAPOD_MAX_RUN_USD:-3}
      ORCHAPOD_MAX_DAY_USD: ${ORCHAPOD_MAX_DAY_USD:-15}
      ORCHAPOD_KILL_SWITCH: ${ORCHAPOD_KILL_SWITCH:-0}
      ORCHAPOD_ANON_SCALE: ${ORCHAPOD_ANON_SCALE:-0.1}
      ORCHAPOD_ADMIN_TOKEN: ${ORCHAPOD_ADMIN_TOKEN:-}
      ORCHAPOD_NODE_TIMEOUT_S: ${ORCHAPOD_NODE_TIMEOUT_S:-5400}
      ORCHAPOD_MAX_COMPARES: ${ORCHAPOD_MAX_COMPARES:-4}
      STUB: ${STUB:-}
      HF_TOKEN: ${HF_TOKEN:-}
      VASTAI_API_KEY: ${VASTAI_API_KEY:-}   # spikes only; used only by nodes whose provider_pref names vastai
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ORCHAPOD_FROM_EMAIL: ${ORCHAPOD_FROM_EMAIL:-noreply@orchapod.ai}
      ORCHAPOD_ALERT_EMAIL: ${ORCHAPOD_ALERT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app/api    # hot reload
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_WS_URL: ws://localhost:8001
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
