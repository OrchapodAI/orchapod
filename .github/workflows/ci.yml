name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── 0. Provider unit tests ──────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        run: pip install -r requirements-dev.txt -r apps/api/requirements.txt

      - name: Lint
        run: ruff check apps packages containers

      - name: Run tests
        run: python -m pytest tests -q

  # ── 1. API Docker image ─────────────────────────────────────────────────────
  api:
    needs: test
    name: Build API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.dev
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orchapod-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/orchapod-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Frontend type-check + build ─────────────────────────────────────────
  web:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: apps/web
        run: pnpm test

      - name: Type-check
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  # ── 3. Training containers (matrix) ────────────────────────────────────────
  containers:
    name: Build container / ${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false          # build all nodes even if one fails
      matrix:
        node:
          - hf-download
          - data-prep
          - unsloth-train
          - distill-sft
          - quantize
          - lm-eval
          - vllm-serve
          - synth-distilabel
          - tf-finetune
          - tf-deploy
          - web-research
          - judge-eval

    steps:
      - uses: actions/checkout@v4

      # unsloth-train is a ~20 GB image (CUDA 12.8, torch 2.10, amd64) and distill-sft starts from the 22 GB NGC pytorch image: more
      # than a standard runner has free. Clear its preinstalled toolchains first, for those two only (pinned to the v1.3.1 commit).
      - name: Free disk space
        if: contains(fromJSON('["unsloth-train", "distill-sft"]'), matrix.node)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.node }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/${{ matrix.node }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.node }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.node }}:${{ github.ref_name }}
            ${{ github.ref_name == 'NebiusHackathon' && format('ghcr.io/{0}/{1}:latest', github.repository_owner, matrix.node) || '' }}
          cache-from: type=gha,scope=${{ matrix.node }}
          cache-to: type=gha,scope=${{ matrix.node }},mode=max

  # ── 4. Production images (infra/docker-compose.prod.yml): built, never pushed; the VM builds its own ──────
  prod-images:
    name: Build prod images (no push)
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'NebiusHackathon'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # it never pushes: no packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build apps/api/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=prod-api
          cache-to: type=gha,scope=prod-api,mode=max

      - name: Build apps/web/Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
            NEXT_PUBLIC_WS_URL=wss://api.example.com
            NEXT_PUBLIC_SITE_URL=https://app.example.com
          cache-from: type=gha,scope=prod-web
          cache-to: type=gha,scope=prod-web,mode=max
