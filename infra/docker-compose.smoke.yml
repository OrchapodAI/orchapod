# Local rehearsal of the prod stack (docs/HOSTING.md "Rehearse locally"); never on the VM. On top of docker-compose.prod.yml:
# Caddy on 18080/18443 with its own CA instead of Let's Encrypt, MinIO as the bucket, and a 5 s api healthcheck so the
# watchdog can be tried in under a minute.
services:
  caddy:
    ports: !override
      - "18080:80"
      - "18443:443"
    command: caddy run --config /etc/caddy/Smoke.caddyfile --adapter caddyfile
    configs:
      - source: smoke_caddyfile
        target: /etc/caddy/Smoke.caddyfile
  api:
    healthcheck:
      interval: 5s
      start_period: 20s
  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372  # MinIO RELEASE.2026-08-04 from Pigsty's community builds: minio/minio is no longer pullable anonymously (qa-w10)
    command: server /data
    environment:
      MINIO_ROOT_USER: ${ORCHAPOD_R2_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${ORCHAPOD_R2_SECRET_KEY}

configs:
  smoke_caddyfile:
    content: |
      {
        local_certs
        skip_install_trust
      }
      import /etc/caddy/Caddyfile
