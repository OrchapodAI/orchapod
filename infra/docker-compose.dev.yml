# Local development environment — Nebius x NVIDIA Hackathon edition
# Runs Postgres, Redis, and MinIO locally. GPU pods run on Nebius AI Cloud.
# CPU nodes (hf-import, data-prep, synth-distilabel, etc.) run via LocalDockerProvider.
#
# Usage: docker compose -f infra/docker-compose.dev.yml up -d
#
# Required .env keys for hackathon demo:
#   NEBIUS_API_KEY       — Token Factory (Nemotron inference, teacher LLM, judge)
#   NEBIUS_IAM_TOKEN     — AI Cloud compute (GPU jobs for training/serving)
#   NEBIUS_FOLDER_ID     — Nebius project folder ID

version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchapod
      POSTGRES_USER: orchapod
      POSTGRES_PASSWORD: orchapod_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchapod"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO as local R2 stand-in (S3-compatible)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orchapod
      MINIO_ROOT_PASSWORD: orchapod_dev
    ports:
      - "9000:9000"   # S3 API (set ORCHAPOD_R2_ENDPOINT=http://localhost:9000)
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  # FastAPI control plane
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile.dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://orchapod:orchapod_dev@postgres:5432/orchapod
      REDIS_URL: redis://redis:6379
      ORCHAPOD_R2_ENDPOINT: http://minio:9000
      ORCHAPOD_R2_ACCESS_KEY: orchapod
      ORCHAPOD_R2_SECRET_KEY: orchapod_dev
      ORCHAPOD_R2_BUCKET: orchapod-artifacts
      ORCHAPOD_CONTROL_URL: http://api:8000
      # Nebius AI Cloud — GPU compute (primary for hackathon)
      NEBIUS_IAM_TOKEN: ${NEBIUS_IAM_TOKEN:-}
      NEBIUS_FOLDER_ID: ${NEBIUS_FOLDER_ID:-}
      NEBIUS_SUBNET_ID: ${NEBIUS_SUBNET_ID:-}
      # Nebius Token Factory — Nemotron inference (teacher LLM + judge)
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-nvidia/Llama-3.1-Nemotron-Ultra-253B-v1}
      # Fallback GPU provider
      VASTAI_API_KEY: ${VASTAI_API_KEY:-}
      # Fallback judge / optional features
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # HuggingFace token for private/gated models
      HF_TOKEN: ${HF_TOKEN:-}
      # Cloudflare Tunnel token (optional — see .env.example for setup)
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../apps/api:/app/api    # hot reload
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  web_node_modules:
