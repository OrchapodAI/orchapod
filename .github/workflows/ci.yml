name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── 0. Provider unit tests ──────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test deps
        run: pip install -r requirements-dev.txt -r apps/api/requirements.txt huggingface_hub ruff==0.17.1

      - name: Lint
        run: ruff check apps packages containers

      - name: Run tests
        run: python -m pytest tests -q

  # ── 1. API Docker image ─────────────────────────────────────────────────────
  api:
    needs: test
    name: Build API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile.dev
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/orchapod-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/orchapod-api:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Frontend type-check + build ─────────────────────────────────────────
  web:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Type-check
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:8000

  # ── 3. Training containers (matrix) ────────────────────────────────────────
  containers:
    name: Build container / ${{ matrix.node }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false          # build all nodes even if one fails
      matrix:
        node:
          - hf-download
          - data-prep
          - unsloth-train
          - distill-sft
          - quantize
          - lm-eval
          - vllm-serve
          - synth-distilabel
          - web-research

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.node }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/${{ matrix.node }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.node }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.node }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.node }}
          cache-to: type=gha,scope=${{ matrix.node }},mode=max
