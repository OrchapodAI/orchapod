# Hosted stack on one VM (docs/HOSTING.md; hackathon/briefs/2026-10-22-hosting-proposal.md).
# Only Caddy publishes ports (80, 443); api, web, postgres and redis talk on the compose network.
# cpu and api nodes run as sibling containers on the host's Docker and reach the API at https://api.<DOMAIN>.
# On the VM, from /opt/orchapod: docker compose --env-file .env -f infra/docker-compose.prod.yml up -d --build
name: orchapod

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  caddy:
    <<: *service
    image: caddy:2.10.2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data   # certificates; losing them means re-issuing, which Let's Encrypt rate-limits
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    <<: *service
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      # docs/contracts.md "Config" without VASTAI_API_KEY (the hosted app never rents vast.ai GPUs)
      NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
      NEBIUS_BASE_URL: ${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      NEBIUS_PROJECT_ID: ${NEBIUS_PROJECT_ID:-}
      NEBIUS_IAM_TOKEN: ${NEBIUS_IAM_TOKEN:-}
      ORCHAPOD_ENDPOINT_TOKEN: ${ORCHAPOD_ENDPOINT_TOKEN:-}
      ORCHAPOD_R2_ENDPOINT: ${ORCHAPOD_R2_ENDPOINT:?set ORCHAPOD_R2_ENDPOINT in .env (Nebius Object Storage)}
      ORCHAPOD_R2_REGION: ${ORCHAPOD_R2_REGION:?set ORCHAPOD_R2_REGION in .env}
      ORCHAPOD_R2_ACCESS_KEY: ${ORCHAPOD_R2_ACCESS_KEY:?set ORCHAPOD_R2_ACCESS_KEY in .env}
      ORCHAPOD_R2_SECRET_KEY: ${ORCHAPOD_R2_SECRET_KEY:?set ORCHAPOD_R2_SECRET_KEY in .env}
      ORCHAPOD_R2_BUCKET: ${ORCHAPOD_R2_BUCKET:-orchapod-artifacts}
      ORCHAPOD_IMAGE_PREFIX: ${ORCHAPOD_IMAGE_PREFIX:-ghcr.io/bangadpurva}
      DATABASE_URL: postgresql+asyncpg://orchapod:${POSTGRES_PASSWORD}@postgres:5432/orchapod
      REDIS_URL: redis://redis:6379
      ORCHAPOD_CONTROL_URL: https://api.${DOMAIN}
      ORCHAPOD_INTERNAL_SECRET: ${ORCHAPOD_INTERNAL_SECRET:?set ORCHAPOD_INTERNAL_SECRET in .env (R17)}
      ORCHAPOD_MAX_RUN_USD: ${ORCHAPOD_MAX_RUN_USD:-3}
      ORCHAPOD_MAX_DAY_USD: ${ORCHAPOD_MAX_DAY_USD:-15}
      ORCHAPOD_KILL_SWITCH: ${ORCHAPOD_KILL_SWITCH:-0}
      ORCHAPOD_ANON_SCALE: ${ORCHAPOD_ANON_SCALE:-0.1}
      ORCHAPOD_ADMIN_TOKEN: ${ORCHAPOD_ADMIN_TOKEN:-}
      ORCHAPOD_NODE_TIMEOUT_S: ${ORCHAPOD_NODE_TIMEOUT_S:-5400}
      ORCHAPOD_MAX_COMPARES: ${ORCHAPOD_MAX_COMPARES:-4}
      ORCHAPOD_CORS_ORIGINS: https://app.${DOMAIN}   # backend-w4's CORS allow-list reads it
      STUB: ${STUB:-}
      HF_TOKEN: ${HF_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ORCHAPOD_FROM_EMAIL: ${ORCHAPOD_FROM_EMAIL:-noreply@orchapod.ai}
      ORCHAPOD_ALERT_EMAIL: ${ORCHAPOD_ALERT_EMAIL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # nodes run as siblings; root on the host, so the VM has one purpose
      - ../nebius:/root/.nebius                     # the nebius CLI's service-account profile (R15), for Jobs and Endpoints
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # the shallow /livez: /health is deep (Postgres, Redis, storage), and a restart fixes none of those, so probing it would
      # restart the api, and fail every run in flight, on any dependency blip
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/livez"]
      interval: 30s
      timeout: 5s
      retries: 3   # unhealthy after 3 failed /livez in a row; scripts/watchdog.sh then restarts it
      start_period: 60s

  web:
    <<: *service
    build:
      context: ../apps/web
      args:   # baked in at build time
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://api.${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://app.${DOMAIN}   # link previews (OG metadata)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/agent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    <<: *service
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orchapod
      POSTGRES_USER: orchapod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchapod -d orchapod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:   # run events only (pub/sub), nothing to keep
    <<: *service
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
